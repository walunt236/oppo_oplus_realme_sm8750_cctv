          if [[ "${{ inputs.droidspaces_enable }}" != "false" ]]; then
            echo "[INFO] 启用 Droidspaces 容器支持..." | tee -a "$LOG_FILE"
            cd kernel_workspace/common
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o fix_sysvipc_kabi_6_7_8.patch "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch"
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o fix_oplus_bsp_midas.patch "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch"
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o ntsync_base.patch "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_base.patch"
            # compat 补丁优先按当前 android 版本匹配；缺失时回退 android15 基线（AOSP android15-6.6 合并后的内核基线）
            NTSYNC_COMPAT_FILE="ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch"
            if ! curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o ntsync_compat.patch "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/$NTSYNC_COMPAT_FILE"; then
              echo "[WARN] $NTSYNC_COMPAT_FILE 不存在，回退到 android15 基线 compat 补丁..." | tee -a "$LOG_FILE"
              curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o ntsync_compat.patch "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_android15-${{ env.KERNEL_VERSION }}.patch" || true
            fi
            patch -p1 -F 3 < ntsync_base.patch || true
            patch -p1 -F 3 < ntsync_compat.patch || true
            cat >> ./arch/arm64/configs/gki_defconfig << 'DSCFG'
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_NAMESPACES=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NTSYNC=y
          DSCFG
            if [[ "${{ inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
              # EVDI/蓝牙等 extend 模块依赖动态 usermodehelper(modprobe),必须覆盖 OnePlus 默认 STATIC_USERMODEHELPER=y
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig
              curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o evdi_drm.patch "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/evdi_drm.patch"
              patch -p1 -F 3 < evdi_drm.patch || true
              echo "CONFIG_DRM_LINDROID_EVDI=y" >> ./arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用ADIOS IO调度器
        if: inputs.adios_enable
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          echo "[INFO] 启用 ADIOS I/O 调度器..." | tee -a "$LOG_FILE"
          cd kernel_workspace
          cat >> ./common/arch/arm64/configs/gki_defconfig << 'ADIOSCFG'
          CONFIG_MQ_IOSCHED_ADIOS=y
          CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y
          ADIOSCFG

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          echo "[INFO] 启用 Re-Kernel 支持..." | tee -a "$LOG_FILE"
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用基带保护
        if: inputs.baseband_guard
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          echo "[INFO] 启用基带保护..." | tee -a "$LOG_FILE"
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash || {
            echo "[ERROR] Baseband-guard 安装失败" | tee -a "$LOG_FILE"
            exit 1
          }
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 添加制作名称及固化版本信息
        run: |
          cd kernel_workspace
          echo "CONFIG_LOCALVERSION_AUTO=y" >> ./common/arch/arm64/configs/gki_defconfig

          LOCALVER="-${KERNEL_SUFFIX}"
          if [[ -n "$UPSTREAM_SUBLEVEL" ]] && [[ "$UPSTREAM_SUBLEVEL" != "0" ]]; then
            LOCALVER="${LOCALVER}_${UPSTREAM_SUBLEVEL}"
          fi

          # 不假设 OEM 默认 LOCALVERSION 内容：清除所有旧值后写入实际后缀（替代硬编码 -4k 的 sed）
          sed -i '/^CONFIG_LOCALVERSION=/d' ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LOCALVERSION=\"${LOCALVER}\"" >> ./common/arch/arm64/configs/gki_defconfig

          # setlocalversion: 替换任意位置的 echo "$res" 语句，不再假设它是文件最后一行
          for f in ./common/scripts/setlocalversion; do
            sed -i 's|^echo "\$res"$|echo "'"${LOCALVER}"'"|' "$f"
          done
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
      - name: 启用 HZ=300调度
        if: inputs.hz_300
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          echo "[INFO] 启用 HZ=300..." | tee -a "$LOG_FILE"
          cd kernel_workspace
          cat >> ./common/arch/arm64/configs/gki_defconfig << 'HZ300CFG'
          # CONFIG_HZ_250 is not set
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          HZ300CFG

      - name: 启用 BBRv3 TCP 拥塞控制
        if: inputs.bbrv3_enable
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          echo "[INFO] 应用 BBRv3 补丁..."
          cd kernel_workspace/common
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o bbrv3.patch "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch"
          
          if git apply -p1 < bbrv3.patch 2>/dev/null; then
            echo "[INFO] BBRv3 git apply 成功" | tee -a "$LOG_FILE"
          elif patch -p1 -F 3 < bbrv3.patch 2>/dev/null; then
            echo "[INFO] BBRv3 patch 成功" | tee -a "$LOG_FILE"
          else
            echo "[ERROR] BBRv3 补丁失败" | tee -a "$LOG_FILE"
            exit 1
          fi
          
          echo "CONFIG_TCP_CONG_BBR3=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEFAULT_BBR3=y" >> ./arch/arm64/configs/gki_defconfig

      - name: 调度器优化 (16ms PELT / NEXT_BUDDY / HRTICK / SIS_PROP)
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          cd kernel_workspace/common

          # PELT 半衰期 32ms -> 16ms
          cat > kernel/sched/sched-pelt.h << 'PELTEOF'
          /* SPDX-License-Identifier: GPL-2.0 */
          /* Generated by Documentation/scheduler/sched-pelt; do not modify. */

          static const u32 runnable_avg_yN_inv[] __maybe_unused = {
          	0xffffffff,	0xf5257d14,	0xeac0c6e6,	0xe0ccdeeb,	0xd744fcc9,	0xce248c14,
          	0xc5672a10,	0xbd08a39e,	0xb504f333,	0xad583ee9,	0xa5fed6a9,	0x9ef5325f,
          	0x9837f050,	0x91c3d373,	0x8b95c1e3,	0x85aac367,
          };

          #define LOAD_AVG_PERIOD 16
          #define LOAD_AVG_MAX 24130
          PELTEOF

          sed -i 's/SCHED_FEAT(NEXT_BUDDY, false)/SCHED_FEAT(NEXT_BUDDY, true)/' kernel/sched/features.h
          sed -i 's/SCHED_FEAT(HRTICK, false)/SCHED_FEAT(HRTICK, true)/' kernel/sched/features.h
          sed -i 's/SCHED_FEAT(SIS_PROP, false)/SCHED_FEAT(SIS_PROP, true)/' kernel/sched/features.h

          echo "[INFO] 调度器优化完成 (16ms PELT / NEXT_BUDDY / HRTICK / SIS_PROP)" | tee -a "$LOG_FILE"


      - name: 应用风驰引擎及优化补丁
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          
          echo "[INFO] 获取 Wild 补丁仓..."
          WILD_DIR="$HOME/.cache_patches/wild_patches"
          mkdir -p "$HOME/.cache_patches"

          if [ -d "$WILD_DIR/.git" ]; then
            echo "[INFO] [秒过] 本地补丁仓已存在，增量同步上游最新提交..."
            git -C "$WILD_DIR" fetch --depth=1 origin main || true
            git -C "$WILD_DIR" reset --hard FETCH_HEAD || true
          else
            echo "[INFO] 首次克隆风驰补丁仓..."
            git clone --depth=1 https://github.com/WildKernels/kernel_patches.git "$WILD_DIR"
          fi

          # 上游目录结构可能变动：优先 oneplus/hmbird，未命中则全仓搜索兜底
          PATCH_FILE=$(find "$WILD_DIR/oneplus/hmbird/" -maxdepth 1 -name "fengchi_OP13_*.patch" 2>/dev/null | head -n 1)
          if [ -z "$PATCH_FILE" ]; then
            echo "[WARN] oneplus/hmbird 目录未找到风驰补丁，开始全仓搜索..." | tee -a "$LOG_FILE"
            PATCH_FILE=$(find "$WILD_DIR" -type f -name "fengchi_OP13_*.patch" 2>/dev/null | head -n 1)
          fi
          if [ -z "$PATCH_FILE" ]; then
            echo "[ERROR] 未匹配到一加13风驰补丁" | tee -a "$LOG_FILE"
            exit 1
          fi

          echo "[INFO] 匹配风驰补丁: $PATCH_FILE" | tee -a "$LOG_FILE"
          sed -i 's/\r$//' "$PATCH_FILE"
          
          cd common
          
          echo "[INFO] 注入风驰引擎补丁..."
          patch -p1 -F 3 -f < "$PATCH_FILE" || true
          REJ_COUNT=$(find . -name "*.rej" 2>/dev/null | wc -l)
          if [ "$REJ_COUNT" -gt 0 ]; then
            echo "[WARN] 风驰补丁有 $REJ_COUNT 个 reject:" | tee -a "$LOG_FILE"
            find . -name "*.rej" 2>/dev/null | while read f; do
              echo "  --- $(basename "$f") ---" | tee -a "$LOG_FILE"
              head -20 "$f" | tee -a "$LOG_FILE"
            done
          fi
          if [ "$REJ_COUNT" -le 3 ]; then
            echo "[WARN] 风驰补丁 reject ≤3（上游合并导致偏移），继续编译" | tee -a "$LOG_FILE"
          else
            echo "[ERROR] 风驰核心补丁应用失败（$REJ_COUNT 个 reject）" | tee -a "$LOG_FILE"
            exit 1
          fi
          
          echo "[INFO] 注入 Overwriter 补丁..."
          OVERWRITER_PATCH=$(find "$WILD_DIR/oneplus/hmbird/" -maxdepth 1 -name "overwriter.patch" 2>/dev/null | head -n 1)
          if [ -z "$OVERWRITER_PATCH" ]; then
            echo "[WARN] oneplus/hmbird 未找到 overwriter.patch，开始全仓搜索..." | tee -a "$LOG_FILE"
            OVERWRITER_PATCH=$(find "$WILD_DIR" -type f -name "overwriter.patch" 2>/dev/null | head -n 1)
          fi
          if [ -z "$OVERWRITER_PATCH" ]; then
            echo "[ERROR] Overwriter 补丁未找到" | tee -a "$LOG_FILE"
            exit 1
          fi
          sed -i 's/\r$//' "$OVERWRITER_PATCH"
          patch -p1 -F 3 -f < "$OVERWRITER_PATCH" || {
            echo "[ERROR] Overwriter 补丁应用失败" | tee -a "$LOG_FILE"
            exit 1
          }
          
          if [ -f "./drivers/of/overwriter/overwrite_configs/convert_configs.sh" ]; then
            chmod +x ./drivers/of/overwriter/overwrite_configs/convert_configs.sh
          fi
          
          echo "[INFO] 固化 Hmbird Defconfig..."
          HMBIRD_CFG=$(find "$WILD_DIR/oneplus/hmbird/" -maxdepth 1 -name "hmbird_config.patch" 2>/dev/null | head -n 1)
          if [ -z "$HMBIRD_CFG" ]; then
            echo "[WARN] oneplus/hmbird 未找到 hmbird_config.patch，开始全仓搜索..." | tee -a "$LOG_FILE"
            HMBIRD_CFG=$(find "$WILD_DIR" -type f -name "hmbird_config.patch" 2>/dev/null | head -n 1)
          fi
          if [ -z "$HMBIRD_CFG" ]; then
            echo "[ERROR] Hmbird Defconfig 补丁未找到" | tee -a "$LOG_FILE"
            exit 1
          fi
          sed -i 's/\r$//' "$HMBIRD_CFG"
          patch -p1 -F 3 -f < "$HMBIRD_CFG" || {
            echo "[ERROR] Hmbird Defconfig 补丁应用失败" | tee -a "$LOG_FILE"
            exit 1
          }
          
          patch -p1 --forward -f < "$WILD_DIR/common/optimized_mem_operations.patch" || echo "[WARN] optimized_mem_operations.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/file_struct_8bytes_align.patch" || echo "[WARN] file_struct_8bytes_align.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/reduce_cache_pressure.patch" || echo "[WARN] reduce_cache_pressure.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/mem_opt_prefetch.patch" || echo "[WARN] mem_opt_prefetch.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/optimise_memcmp.patch" || echo "[WARN] optimise_memcmp.patch 应用失败，继续..."
          
          cat "$WILD_DIR/common/clear_page_16bytes_align.patch" | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | patch -p1 -F3 --forward -f || echo "[WARN] clear_page_16bytes_align.patch 应用失败，继续..."

          patch -p1 --forward -f < "$WILD_DIR/common/f2fs_reduce_congestion.patch" || echo "[WARN] f2fs_reduce_congestion.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/f2fs_enlarge_min_fsync_blocks.patch" || echo "[WARN] f2fs_enlarge_min_fsync_blocks.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/increase_ext4_default_commit_age.patch" || echo "[WARN] increase_ext4_default_commit_age.patch 应用失败，继续..."

          patch -p1 --forward -f < "$WILD_DIR/common/int_sqrt.patch" || echo "[WARN] int_sqrt.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/reduce_gc_thread_sleep_time.patch" || echo "[WARN] reduce_gc_thread_sleep_time.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/increase_sk_mem_packets.patch" || echo "[WARN] increase_sk_mem_packets.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/disable_cache_hot_buddy.patch" || echo "[WARN] disable_cache_hot_buddy.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/force_tcp_nodelay.patch" || echo "[WARN] force_tcp_nodelay.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/minimise_wakeup_time.patch" || echo "[WARN] minimise_wakeup_time.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/reduce_freeze_timeout.patch" || echo "[WARN] reduce_freeze_timeout.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/silence_irq_cpu_logspam.patch" || echo "[WARN] silence_irq_cpu_logspam.patch 应用失败，继续..."
          patch -p1 --forward -f < "$WILD_DIR/common/silence_system_logspam.patch" || echo "[WARN] silence_system_logspam.patch 应用失败，继续..."
          if [ -f "$HOME/.cache_patches/zram_patches/common/EnablePOLLY.patch" ]; then
            patch -p1 --forward -f < "$HOME/.cache_patches/zram_patches/common/EnablePOLLY.patch" || echo "[WARN] EnablePOLLY.patch 应用失败，继续..."
          else
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/EnablePOLLY.patch "https://raw.githubusercontent.com/mrcxlinux/kernel_patches/main/common/EnablePOLLY.patch"
            patch -p1 --forward -f < /tmp/EnablePOLLY.patch || echo "[WARN] EnablePOLLY.patch 应用失败，继续..."
          fi
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/mm_zsmalloc.patch "https://github.com/brokestar233/android_kernel_common_oneplus_sm8750/commit/d831954.patch"
          patch -p1 --forward -f < /tmp/mm_zsmalloc.patch || echo "[WARN] mm_zsmalloc 应用失败，继续..."
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/mm_kvmalloc.patch "https://github.com/brokestar233/android_kernel_common_oneplus_sm8750/commit/a8093f3.patch"
          patch -p1 --forward -f < /tmp/mm_kvmalloc.patch || echo "[WARN] mm_kvmalloc 应用失败，继续..."
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/mm_slab.patch "https://github.com/brokestar233/android_kernel_common_oneplus_sm8750/commit/936de3f.patch"
          patch -p1 --forward -f < /tmp/mm_slab.patch || echo "[WARN] mm_slab 应用失败，继续..."
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/mm_vmpressure.patch "https://github.com/brokestar233/android_kernel_common_oneplus_sm8750/commit/99b920c.patch"
          patch -p1 --forward -f < /tmp/mm_vmpressure.patch || echo "[WARN] mm_vmpressure 应用失败，继续..."
          TOTAL_REJ=0
          BATCH_REJ=$(find . -name "*.rej" 2>/dev/null | wc -l)
          TOTAL_REJ=$((TOTAL_REJ + BATCH_REJ))
          echo "[INFO] 风驰批补丁 reject: $BATCH_REJ" | tee -a "$LOG_FILE"
          find . -name "*.rej" -delete 2>/dev/null
          mkdir -p "$HOME/.cache_patches/aosp"
          for hash in 47f80469849a 5fddd8e6a0a7 0a9eef42768c 71bd6942e33f ef0123e95425 7abe312b37cf 6a42fccfc2bc d43ee181a478 5c8ecdcfbfb0 c5d6863c9aba 9eecad532ad3 c7a8aea27b87; do
            if [ ! -s "$HOME/.cache_patches/aosp/$hash.patch" ]; then
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 "https://android.googlesource.com/kernel/common/+/$hash^!/?format=TEXT" 2>/dev/null | base64 -d > "$HOME/.cache_patches/aosp/$hash.patch" 2>/dev/null || rm -f "$HOME/.cache_patches/aosp/$hash.patch"
            fi
          done
          for hash in 47f80469849a 5fddd8e6a0a7 0a9eef42768c 71bd6942e33f ef0123e95425 7abe312b37cf 6a42fccfc2bc d43ee181a478 5c8ecdcfbfb0 c5d6863c9aba 9eecad532ad3 c7a8aea27b87; do
            patch -p1 --forward -F 3 < "$HOME/.cache_patches/aosp/$hash.patch" 2>/dev/null || echo "[WARN] aosp/$hash.patch 应用失败，继续..."
          done
          BATCH_REJ=$(find . -name "*.rej" 2>/dev/null | wc -l)
          TOTAL_REJ=$((TOTAL_REJ + BATCH_REJ))
          echo "[INFO] AOSP 补丁 reject: $BATCH_REJ" | tee -a "$LOG_FILE"
          find . -name "*.rej" -delete 2>/dev/null
          mkdir -p "$HOME/.cache_patches/palazik"
          for hash in e8400a0 a09e19e; do
            if [ ! -s "$HOME/.cache_patches/palazik/$hash.patch" ]; then
              curl -fSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 -o "$HOME/.cache_patches/palazik/$hash.patch" "https://github.com/palazik/android_kernel_common_oneplus_sm8750/commit/$hash.patch" 2>/dev/null || rm -f "$HOME/.cache_patches/palazik/$hash.patch"
            fi
          done
          for hash in e8400a0 a09e19e; do
            if [ -s "$HOME/.cache_patches/palazik/$hash.patch" ]; then
              patch -p1 --forward -F 3 < "$HOME/.cache_patches/palazik/$hash.patch" 2>/dev/null || echo "[WARN] palazik/$hash.patch 应用失败，继续..."
            else
              echo "[WARN] palazik/$hash.patch 缺失或为空，跳过" | tee -a "$LOG_FILE"
            fi
          done
          BATCH_REJ=$(find . -name "*.rej" 2>/dev/null | wc -l)
          TOTAL_REJ=$((TOTAL_REJ + BATCH_REJ))
          echo "[INFO] Palazik 补丁 reject: $BATCH_REJ" | tee -a "$LOG_FILE"
          find . -name "*.rej" -delete 2>/dev/null
          UNICODE_PATCH=$(find "$WILD_DIR/" -name "*unicode*.patch" | head -n 1)
          if [ -n "$UNICODE_PATCH" ]; then
            echo "[INFO] 匹配到 Unicode 防检测路径补丁: $UNICODE_PATCH" | tee -a "$LOG_FILE"
            sed -i 's/\r$//' "$UNICODE_PATCH"
            patch -p1 --forward -f < "$UNICODE_PATCH" || echo "[WARN] Unicode 补丁应用失败，继续..."
          fi
          
          if [ -f "lib/Makefile" ]; then
            echo 'CFLAGS_lz4.o += -O3' >> lib/Makefile
            echo 'CFLAGS_lz4hc.o += -O3' >> lib/Makefile
          fi
          
          git -C "$GITHUB_WORKSPACE/kernel_workspace/common" checkout -- drivers/dma-buf/dma-buf.c 2>/dev/null || true
          
          BATCH_REJ=$(find . -name "*.rej" 2>/dev/null | wc -l)
          TOTAL_REJ=$((TOTAL_REJ + BATCH_REJ))
          find . -name "*.rej" -delete 2>/dev/null
          echo "[INFO] Unicode/收尾补丁 reject: $BATCH_REJ" | tee -a "$LOG_FILE"

          if [ "$TOTAL_REJ" -gt 15 ]; then
            echo "[ERROR] 风驰+优化补丁总计 $TOTAL_REJ 个 reject（>15），请检查补丁兼容性" | tee -a "$LOG_FILE"
            exit 1
          elif [ "$TOTAL_REJ" -gt 10 ]; then
            echo "[WARN] 风驰+优化补丁总计 $TOTAL_REJ 个 reject，部分优化可能未生效" | tee -a "$LOG_FILE"
          else
            echo "[INFO] 风驰+优化补丁 reject 总计 $TOTAL_REJ 个，正常" | tee -a "$LOG_FILE"
          fi
          
          echo "[INFO] 风驰引擎补丁注入完成" | tee -a "$LOG_FILE"

      - name: 增量编译 mtime 钳制（源码指纹一致时跳过未变更对象）
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          cd kernel_workspace/common
          # 源码树指纹 = git status porcelain 哈希：工作流改动/输入变化/上游源变化都会体现在其中
          PATCH_HASH=$(git status --porcelain 2>/dev/null | md5sum | cut -d' ' -f1)
          echo "PATCH_HASH=$PATCH_HASH" >> $GITHUB_ENV
          STORED=$(cat "$HOME/.cache_patches/build_state" 2>/dev/null || true)
          if [[ "$STORED" == "$PATCH_HASH" ]]; then
            echo "[INFO] 增量编译：源码指纹与上次成功构建一致，钳制全部跟踪源文件 mtime..." | tee -a "$LOG_FILE"
            # 指纹一致 ⇒ 整棵树逐字节相同 ⇒ 全部 .o 有效；钳制 Makefile/Kconfig 阻断 GEN 级联重编
            git ls-files | xargs -r -P 16 touch -d @1500000000 2>/dev/null || true
            git update-index --refresh 2>/dev/null || true
            echo "[INFO] mtime 钳制完成，make 将只重编被补丁改动的文件" | tee -a "$LOG_FILE"
          else
            echo "[INFO] 全量模式：源码指纹变化/首次构建/上次构建未成功" | tee -a "$LOG_FILE"
          fi

      - name: 构建内核配置
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          WORKDIR="$(pwd)"
          CLANG_DIR_NAME="Clang-19.0.0git-20240723"
          
          # 第一步：垫底加载旧版 build-tools
          export PATH="$HOME/.toolchains/build-tools-r510928/build-tools/bin:$PATH"
          # 第二步：加载 Clang 19 核心编译器
          export PATH="$HOME/.toolchains/$CLANG_DIR_NAME/bin:$PATH"
          # 第三步：加载 ccache
          export PATH="/usr/lib/ccache:$PATH"
          
          cd kernel_workspace/common

          # 默认增量编译（保留 out/ 复用已编译对象）；clean_build=true 时强制全量
          if [[ "${{ inputs.clean_build }}" == "true" ]]; then
            echo "[INFO] clean_build 开启，删除 out/ 执行全量重建..." | tee -a "$LOG_FILE"
            rm -rf out
          fi

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O3 KCFLAGS+=-Wno-error gki_defconfig

          if [[ "${{ inputs.lz4kd_enable }}" == "true" ]] && [ -f out/.config ]; then
            if grep -q '^CONFIG_ZRAM_DEF_COMP_LZ4KD=y' out/.config && grep -q '^CONFIG_ZRAM_DEF_COMP="lz4kd"' out/.config; then
              echo "[INFO] LZ4KD 配置生效 (ZRAM_DEF_COMP=lz4kd)" | tee -a "$LOG_FILE"
            else
              echo "[ERROR] LZ4KD 配置未生效，中止构建" | tee -a "$LOG_FILE"
              exit 1
            fi
          fi

          if [ -f out/.config ]; then
            if grep -q '^CONFIG_ZRAM_MEMORY_TRACKING=y' out/.config && grep -q '^CONFIG_ZRAM_TRACK_ENTRY_ACTIME=y' out/.config; then
              echo "[INFO] ZRAM_MEMORY_TRACKING 配置生效 (idle 页重压缩可用)" | tee -a "$LOG_FILE"
            else
              echo "[ERROR] ZRAM_MEMORY_TRACKING 配置未生效，中止构建" | tee -a "$LOG_FILE"
              exit 1
            fi
          fi

          if grep -q '^CONFIG_LLVM_POLLY=y' out/.config; then
            echo "[INFO] LLVM POLLY 配置生效" | tee -a "$LOG_FILE"
          else
            echo "[WARN] LLVM_POLLY 未在 .config 中出现（补丁可能未完全生效），跳过校验继续" | tee -a "$LOG_FILE"
          fi

          if [[ "${{ inputs.diagnosis }}" == "true" ]]; then
            echo "[INFO] 诊断模式开启，已导出 build_config.txt" | tee -a "$LOG_FILE"
            cp out/.config out/build_config.txt
          fi

      - name: 上传诊断配置文本
        if: inputs.diagnosis
        uses: actions/upload-artifact@v7
        with:
          name: kernel-config-${{ github.run_id }}
          if-no-files-found: warn
          path: kernel_workspace/common/out/build_config.txt

      - name: 启用选择性 -O3 优化
        if: inputs.o3_selective
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          cd kernel_workspace/common

          for TARGET_DIR in lib crypto; do
            if [ -d "$TARGET_DIR" ]; then
              echo 'subdir-ccflags-y += -O3 -mllvm -polly -mllvm -polly-vectorizer=stripmine' >> $TARGET_DIR/Makefile
            fi
          done
          
          echo "[INFO] 选择性O3与Polly配置完成" | tee -a "$LOG_FILE"

      - name: 注入GPU优化
        if: inputs.o3_selective
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          cd $GITHUB_WORKSPACE/kernel_workspace

          KGSL_DIR=$(find vendor_modules -name "kgsl_pwrctrl.c" | sed 's/\/kgsl_pwrctrl.c//' | head -n 1)
          if [ -n "$KGSL_DIR" ] && [ -d "$KGSL_DIR" ]; then
            if [ -f "$KGSL_DIR/kgsl_pool.c" ]; then
              sed -i 's/static u32 kgsl_pool_max_pages = .*/static u32 kgsl_pool_max_pages = 65536;/g' "$KGSL_DIR/kgsl_pool.c" 2>/dev/null || true
              sed -i 's/#define KGSL_POOL_MAX_PAGES .*/#define KGSL_POOL_MAX_PAGES 65536/g' "$KGSL_DIR/kgsl_pool.c" 2>/dev/null || true
            fi
            echo "[INFO] KGSL 页池扩容配置完成" | tee -a "$LOG_FILE"
          fi
          
          KGSL_MEM=$(find vendor_modules -name "kgsl_sharedmem.c" 2>/dev/null | head -n 1)
          if [ -n "$KGSL_MEM" ] && [ -f "$KGSL_MEM" ]; then
            sed -i '/vma->vm_flags |=/a \    vma->vm_flags |= (VM_DONTEXPAND | VM_DONTDUMP);' "$KGSL_MEM" 2>/dev/null || true
            echo "[INFO] MGLRU GPU 显存保护机制注入完成" | tee -a "$LOG_FILE"
          fi

      - name: 移植内容
        if: inputs.o3_selective
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          cd $GITHUB_WORKSPACE/kernel_workspace
          SYS_HEAP=$(find common drivers -name "system_heap.c" 2>/dev/null | head -n 1)
          if [ -n "$SYS_HEAP" ] && [ -f "$SYS_HEAP" ]; then
              sed -i 's/static u32 max_pool_size = .*/static u32 max_pool_size = 65536;/g' "$SYS_HEAP" 2>/dev/null || true
              echo "[INFO] DMA-BUF 页池扩容完成" | tee -a "$LOG_FILE"
          fi


          KGSL_PWR=$(find vendor_modules -name "kgsl_pwrctrl.c" 2>/dev/null | head -n 1)
          if [ -n "$KGSL_PWR" ] && [ -f "$KGSL_PWR" ]; then
            echo "[INFO] LLCC 死锁完成" | tee -a "$LOG_FILE"
          fi

      - name: 编译完整内核镜像
        if: ${{ !inputs.diagnosis }}
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          WORKDIR="$(pwd)"
          CLANG_DIR_NAME="Clang-19.0.0git-20240723"
          
          export PATH="$HOME/.toolchains/build-tools-r510928/build-tools/bin:$PATH"
          export PATH="$HOME/.toolchains/$CLANG_DIR_NAME/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          
          cd kernel_workspace/common

          if [[ "${{ inputs.runner_type }}" == "ubuntu-latest" ]]; then
            echo "[INFO] 清理云端磁盘空间..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            wait
          fi

          export SOURCE_DATE_EPOCH=$(date +%s)
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"
          export KBUILD_BUILD_USER="OnePlus"
          export KBUILD_BUILD_HOST="ubuntu-build"

          mkdir -p "$HOME/.thinlto-cache"
          cat << 'EOF' > ld-wrapper
          #!/bin/sh
          exec ld.lld --thinlto-cache-dir="$HOME/.thinlto-cache" --thinlto-jobs="$(nproc --all)" "$@"
          EOF
          chmod +x ld-wrapper

          KCFLAGS_EXTRA="-mcpu=oryon-1 -moutline-atomics -fno-math-errno -fno-strict-aliasing -fno-semantic-interposition -mllvm -enable-misched=true -mllvm -import-instr-limit=40 -falign-functions=32 -mllvm -enable-gvn-hoist -mllvm -enable-load-pre -mllvm -polly-opt-outer-coincidence=true -mllvm -inline-threshold=300 -mllvm -inlinehint-threshold=500 -mllvm -enable-loopinterchange=true -mllvm -enable-ipra -mllvm -enable-phi-of-ops -mllvm -enable-dse-partial-store-merging -mllvm -enable-aarch64-lsr-cost-opt -mllvm -enable-aarch64-or-like-select"

          echo "[INFO] 核心编译器版本检查："
          clang --version | head -n 1
          echo "[INFO] 链接器版本检查："
          ld.lld --version
          # --------------------------
          # Apply MGLRU aggressive aging (last source mod to avoid being overwritten by prior patches)
          if grep -q 'if (min_seq\[!can_swap\] + MIN_NR_GENS < max_seq)' mm/vmscan.c; then
            sed -i '/if (min_seq\[!can_swap\] + MIN_NR_GENS < max_seq)/,+1d' mm/vmscan.c
             echo "[INFO] MGLRU aging threshold relaxed" | tee -a "$LOG_FILE"
           else
             echo "[WARN] MGLRU aging line already modified, skipped" | tee -a "$LOG_FILE"
             fi
              make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS="-O3 -Wno-error $KCFLAGS_EXTRA" Image
          # Save unstripped vmlinux for PGO profile generation
          cp out/vmlinux "$GITHUB_WORKSPACE/vmlinux"
          
          echo "[INFO] 内核镜像编译完成" | tee -a "$LOG_FILE"
          if nm out/vmlinux 2>/dev/null | grep -q "_lz4_decompress_asm"; then
            echo "[INFO] _lz4_decompress_asm 符号校验通过" | tee -a "$LOG_FILE"
          else
            echo "[WARN] _lz4_decompress_asm 符号未找到" | tee -a "$LOG_FILE"
          fi
          
          grep "CONFIG_IP6_NF_NAT" out/.config 2>/dev/null || echo "CONFIG_IP6_NF_NAT: not set"
          ccache -s

      - name: 汇总并打印构建日志
        if: always()
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          echo "=================================================="
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "[INFO] 暂无构建日志"
          fi
          echo "=================================================="

      - name: 保存新的 ccache 缓存
        if: ${{ inputs.runner_type == 'ubuntu-latest' && (inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true') && !inputs.diagnosis }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
      - name: 应用KPM并修补内核
        if: ${{ !inputs.diagnosis }}
        run: |
          if [[ '${{ inputs.kpm_enable }}' == 'builtin' ]] && ( [[ "${{ inputs.ksu_type }}" == "sukisu" ]] || [[ "${{ inputs.ksu_type }}" == "resukisu" ]] ); then
            echo "[INFO] 应用 KPM 并修补内核..."
            cd kernel_workspace/common/out/arch/arm64/boot
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o patch_linux "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux" || {
              echo "[ERROR] KPM patch_linux 下载失败"
              exit 1
            }
            chmod +x patch_linux
            ./patch_linux
            rm -f Image
            mv oImage Image
          fi
          if [[ '${{ inputs.kpm_enable }}' == 'kpn' ]]; then
            echo "[INFO] 应用 KP-N 并修补内核..."
            cd kernel_workspace/common/out/arch/arm64/boot
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 -o kptools-linux "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux" || {
              echo "[WARN] KPN kptools download timed out, skipping"
              exit 0
            }
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 -o kpimg-linux "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux" || {
              echo "[WARN] KPN kpimg download timed out, skipping"
              exit 0
            }
            chmod +x ./kptools-linux
            ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
            rm -f Image
            mv oImage Image
          fi

      - name: 克隆 AnyKernel3 并打包
        if: ${{ !inputs.diagnosis }}
        id: create_zip
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/build_summary.log"
          cd kernel_workspace
          CLONE_OK=0
          # 动态增量：本地已有 AnyKernel3 仓库则增量拉取，失败时直接用本地版本（模板用旧版无碍）
          if [ -d AnyKernel3/.git ]; then
            echo "[INFO] AnyKernel3 仓库已存在，增量同步..."
            if git -C AnyKernel3 fetch --depth=1 origin && git -C AnyKernel3 reset --hard FETCH_HEAD; then
              CLONE_OK=1
            else
              echo "[WARN] AnyKernel3 增量拉取失败，使用本地已有版本"
              CLONE_OK=1
            fi
          fi
          if [[ $CLONE_OK -ne 1 ]]; then
            rm -rf AnyKernel3
            for i in 1 2 3 4 5 6 7 8; do
              if git clone https://github.com/cctv18/AnyKernel3 --depth=1 AnyKernel3; then
                CLONE_OK=1
                break
              fi
              echo "[WARN] AnyKernel3 克隆失败(第${i}次)，5 秒后重试..."
              sleep 5
            done
          fi
          if [[ $CLONE_OK -ne 1 ]]; then
            echo "[ERROR] AnyKernel3 克隆失败，终止打包"
            exit 1
          fi
          # 保留 .git 供下次增量拉取（zip 用 ./* 通配符，不会包含隐藏目录）
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "[ERROR] 未找到内核镜像文件"
            exit 1
          fi
          
          case '${{ inputs.ksu_type }}' in
            sukisu)   KSU_TYPENAME="SukiSU" ;;
            resukisu) KSU_TYPENAME="ReSukiSU" ;;
            ksunext)  KSU_TYPENAME="KSUNext" ;;
            ksu)      KSU_TYPENAME="KSU" ;;
            *)        KSU_TYPENAME="none" ;;
          esac

          if [[ '${{ inputs.kpm_enable }}' == 'kpn' ]]; then
            curl -fSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 -o kpn.zip "https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip" || echo "[WARN] kpn.zip 下载失败，跳过 KPN 模块" | tee -a "$LOG_FILE"
          fi

          BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          AK3_NAME="AnyKernel3-${KSU_TYPENAME}-${{ env.KSUVER }}-${{ env.KERNEL_VERSION_FULL }}-${{ env.KERNEL_SUFFIX }}-${BUILD_DATE}.zip"
          FULL_VERSION="${{ env.KERNEL_VERSION_FULL }}-${{ env.KERNEL_SUFFIX }}"
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          {
            echo "Author: $GITHUB_ACTOR"
            echo "Repo: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Time: $TIME_NOW"
            echo "Kernel Ver: $FULL_VERSION"
            echo "KSU Branch: ${KSU_TYPENAME}"
            echo "KSU Ver: ${{ env.KSUVER }}"
            echo "susfs: ${{ inputs.susfs_enable }}"
            echo "KPM: ${{ inputs.kpm_enable }}"
            echo "LZ4: ${{ inputs.lz4_enable }}"
            echo "LZ4KD: ${{ inputs.lz4kd_enable }}"
            echo "IPset: ${{ inputs.better_net }}"
            echo "BBRv3: ${{ inputs.bbrv3_enable }}"
            echo "Droidspaces: ${{ inputs.droidspaces_enable }}"
            echo "ADIOS: ${{ inputs.adios_enable }}"
            echo "Re-Kernel: ${{ inputs.rekernel_enable }}"
            echo "BBG: ${{ inputs.baseband_guard }}"
            echo "RCU_NOCB: ${{ inputs.rcu_nocb_enable }}"
          } > ./ak3.log

          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

          if [[ "${{ inputs.runner_type }}" == "self-hosted" ]]; then
            CUSTOM_LOCAL_PATH="/mnt/d/AK3_DOC"

            if [ -n "$CUSTOM_LOCAL_PATH" ]; then
              TARGET_DIR="$CUSTOM_LOCAL_PATH"
            else
              WIN_DESKTOP_RAW=$(powershell.exe -NoProfile -Command "[Environment]::GetFolderPath('Desktop')" 2>/dev/null | tr -d '\r')
              TARGET_DIR=$(wslpath "$WIN_DESKTOP_RAW" 2>/dev/null)
            fi

            if [ -n "$TARGET_DIR" ]; then
              mkdir -p "$TARGET_DIR"
              cp "../$AK3_NAME" "$TARGET_DIR/"
              echo "[INFO] 已成功保存至本地路径: $TARGET_DIR/$AK3_NAME"
            else
              echo "[WARN] 未找到有效的本地输出路径，跳过本地复制"
            fi
          fi
      - name: 本地工作区定时清理
        if: success() && inputs.runner_type == 'self-hosted'
        run: |
          echo "[INFO] 清理编译产出和临时文件..."
          # 保留 common/out 供增量编译复用（make 依赖追踪自动处理源码/配置变化），仅清理 vendor 输出
          rm -rf kernel_workspace/vendor_modules/out
          rm -f /tmp/*.patch
          ccache -c
          echo "[INFO] ccache 已裁剪至上限"
          for repo in "$HOME/.cache_patches/"*; do
            [ -d "$repo/.git" ] && git -C "$repo" gc --auto 2>/dev/null || true
          done
          # 记录本次成功构建的源码指纹（仅成功且自托管时执行；失败则不写，下次自动全量）
          if [[ -n "${PATCH_HASH:-}" ]]; then
            mkdir -p "$HOME/.cache_patches"
            printf '%s' "$PATCH_HASH" > "$HOME/.cache_patches/build_state"
            echo "[INFO] 增量源码指纹已记录，下次相同源码将增量编译"
          fi
          echo "[INFO] 磁盘清理完成"
    
      - name: 上传 Ccache 调试日志
        if: ${{ always() && inputs.ccache_debug && !inputs.diagnosis }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log

      - name: 上传 ZIP 工件 (仅云端)
        if: ${{ !inputs.diagnosis && inputs.runner_type == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: ak3-release
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          if-no-files-found: error
          

      - name: 发布 Release (仅云端)
        if: ${{ !inputs.diagnosis && inputs.runner_type == 'ubuntu-latest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"
 
          TIME_TAG="$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')"
          RELEASE_TAG="v${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${TIME_TAG}"
          RELEASE_TITLE="OnePlus13 内核 v${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} [${{ inputs.ksu_type }}]"

          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          RELEASE_NOTES="🎉 **一加13 内核编译完成**
          - **构建时间**: ${BUILD_TIME}
          - **KernelSU**: ${{ inputs.ksu_type }} (${{ env.KSUVER }})
          - **SUSFS**: ${{ inputs.susfs_enable }}
          - **KPM**: ${{ inputs.kpm_enable }}"

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            AnyKernel3*.zip
