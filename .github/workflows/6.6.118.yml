          sed -i '/setup_arch(&command_line);/a \    strlcat(boot_command_line, " schedstats=disable panic=30 page_alloc.shuffle=1 cryptomgr.notests rcutree.blimit=1024 workqueue.power_efficient=1 skew_tick=0 random.trust_cpu=on kfence.sample_interval=0", sizeof(boot_command_line));' "$TARGET_MAIN"
          
          if grep -q "strlcat.*boot_command_line" "$TARGET_MAIN"; then
            echo "[INFO] cmdline 注入成功" | tee -a "$LOG_FILE"
          else
            echo "[ERROR] cmdline 注入失败" | tee -a "$LOG_FILE"
